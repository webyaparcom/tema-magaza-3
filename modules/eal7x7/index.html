  .modulex-ust-akordeon-mobil :where(*:not(.material-symbols-outlined)) { font-size: inherit; }

    .modulex-ust-akordeon-mobil-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

  .modulex-ust-akordeon-mobil-kbas { display: flex; align-items: center; gap: 2px; }
  .modulex-ust-akordeon-mobil-koge { display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease; }
  .modulex-ust-akordeon-mobil-koge:hover, .modulex-ust-akordeon-mobil-koge[aria-current="page"], .modulex-ust-akordeon-mobil-kat--aktif > .modulex-ust-akordeon-mobil-kbas > .modulex-ust-akordeon-mobil-koge { color: --accentInk--; }
  .modulex-ust-akordeon-mobil-kac { display: inline-grid; flex: none; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 50%; background-color: transparent; color: inherit; transition: background-color 0.2s ease; }
  .modulex-ust-akordeon-mobil-kac:hover { background-color: color-mix(in srgb, --text-- 8%, transparent); }
  .modulex-ust-akordeon-mobil-arti { position: relative; display: block; width: 12px; height: 12px; transition: transform 0.3s ease; }
  .modulex-ust-akordeon-mobil-arti::before, .modulex-ust-akordeon-mobil-arti::after { content: ""; position: absolute; inset-inline: 0; inset-block-start: 5px; height: 2px; border-radius: 2px; background-color: currentColor; transition: transform 0.3s ease; }
  .modulex-ust-akordeon-mobil-arti::after { transform: rotate(90deg); }
  .modulex-ust-akordeon-mobil-kat--acik > .modulex-ust-akordeon-mobil-kbas .modulex-ust-akordeon-mobil-arti { transform: rotate(180deg); }
  .modulex-ust-akordeon-mobil-kat--acik > .modulex-ust-akordeon-mobil-kbas .modulex-ust-akordeon-mobil-arti::after { transform: rotate(0deg); }
  .modulex-ust-akordeon-mobil-kalt { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows 0.35s ease, visibility 0.35s; }
  .modulex-ust-akordeon-mobil-kaltl { display: grid; min-height: 0; overflow: hidden; }
  .modulex-ust-akordeon-mobil-kat--acik > .modulex-ust-akordeon-mobil-kalt { grid-template-rows: 1fr; visibility: visible; }
  .modulex-ust-akordeon-mobil-kaoge { display: flex; align-items: center; min-height: 40px; padding-inline: 14px; color: inherit; text-decoration: none; transition: color 0.2s ease; }
  .modulex-ust-akordeon-mobil-kaoge:hover, .modulex-ust-akordeon-mobil-kaoge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-akordeon-mobil-yatay .modulex-ust-akordeon-mobil-kalt { position: absolute; inset-block-start: 100%; inset-inline-start: -14px; z-index: 5; min-width: 230px; border-radius: 14px; background-color: --bg--; color: --text--; box-shadow: 0 20px 40px -24px color-mix(in srgb, --text-- 60%, transparent), inset 0 0 0 1px --cizgi--; }
  .modulex-ust-akordeon-mobil-yatay .modulex-ust-akordeon-mobil-kat:hover > .modulex-ust-akordeon-mobil-kalt, .modulex-ust-akordeon-mobil-yatay .modulex-ust-akordeon-mobil-kat:focus-within > .modulex-ust-akordeon-mobil-kalt { grid-template-rows: 1fr; visibility: visible; }
  .modulex-ust-akordeon-mobil-yatay .modulex-ust-akordeon-mobil-kaltl > li:first-child { padding-block-start: 8px; }
  .modulex-ust-akordeon-mobil-yatay .modulex-ust-akordeon-mobil-kaltl > li:last-child { padding-block-end: 8px; }
  .modulex-ust-akordeon-mobil-akordeon { display: grid; }
  .modulex-ust-akordeon-mobil-akordeon > .modulex-ust-akordeon-mobil-kat { border-block-end: 1px solid --cizgi--; }
  .modulex-ust-akordeon-mobil-akordeon .modulex-ust-akordeon-mobil-kbas { justify-content: space-between; }
  .modulex-ust-akordeon-mobil-akordeon .modulex-ust-akordeon-mobil-koge { flex: 1; min-height: 54px; font-size: 1.1rem; }
  .modulex-ust-akordeon-mobil-akordeon .modulex-ust-akordeon-mobil-kac { width: 44px; height: 44px; border: 1px solid --cizgi--; }
  .modulex-ust-akordeon-mobil-akordeon .modulex-ust-akordeon-mobil-kaltl { border-inline-start: 2px solid --accent--; }
  .modulex-ust-akordeon-mobil-akordeon .modulex-ust-akordeon-mobil-kaltl > li:last-child { padding-block-end: 10px; }
  .modulex-ust-akordeon-mobil:not(.modulex-ust-akordeon-mobil--ak) .modulex-ust-akordeon-mobil-akordeon .modulex-ust-akordeon-mobil-kalt { grid-template-rows: 1fr; visibility: visible; }
  .modulex-ust-akordeon-mobil-cubuk > .modulex-ust-akordeon-mobil-son { display: flex; align-items: center; gap: 12px; }
  .modulex-ust-akordeon-mobil-genis { display: flex; align-items: center; gap: 12px; }
  @media (max-width: 1024px) {
    .modulex-ust-akordeon-mobil:not(.modulex-ust-akordeon-mobil--js) .modulex-ust-akordeon-mobil-cubuk { flex-wrap: wrap; }
    .modulex-ust-akordeon-mobil:not(.modulex-ust-akordeon-mobil--js) .modulex-ust-akordeon-mobil-yatay .modulex-ust-akordeon-mobil-kalt { position: static; grid-template-rows: 1fr; visibility: visible; box-shadow: none; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-akordeon-mobil :is(.modulex-ust-akordeon-mobil-baslik, .modulex-ust-akordeon-mobil-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-akordeon-mobil-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-akordeon-mobil { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-akordeon-mobil *, .modulex-ust-akordeon-mobil *::before, .modulex-ust-akordeon-mobil *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-akordeon-mobil";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    const akordeon = (s, P) => {
        const dugmeler = [...s.querySelectorAll("." + P + "-kac")];
        s.classList.add(P + "--ak");
        if (!dugmeler.length) return;
        const li = (x) => x.closest("." + P + "-kat");
        const kapa = (x, odak) => {
          if (x.getAttribute("aria-expanded") !== "true") return;
          x.setAttribute("aria-expanded", "false");
          li(x).classList.remove(P + "-kat--acik");
          if (odak) x.focus();
        };
        dugmeler.forEach((x) => {
          x.addEventListener("click", () => {
            const acik = x.getAttribute("aria-expanded") === "true";
            const kap = x.closest("ul");
            dugmeler.forEach((y) => { if (y !== x && y.closest("ul") === kap) kapa(y, false); });
            if (acik) kapa(x, false);
            else { x.setAttribute("aria-expanded", "true"); li(x).classList.add(P + "-kat--acik"); }
          });
        });
        s.addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          const x = dugmeler.find((y) => y.getAttribute("aria-expanded") === "true" && li(y).contains(document.activeElement));
          if (x) kapa(x, true);
        });
        document.addEventListener("click", (e) => { dugmeler.forEach((x) => { if (!li(x).contains(e.target)) kapa(x, false); }); });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
      akordeon(s, P, az);
    });
  })();
</script>
